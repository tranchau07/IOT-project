version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: smart_classroom_mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=identity_service
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - iot_infra_network
    restart: always

  # MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: smart_classroom_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root
    volumes:
      - mongo_data:/data/db
    networks:
      - iot_infra_network
    restart: always

volumes:
  mysql_data:
  mongo_data:

networks:
  iot_infra_network:
    driver: bridge
